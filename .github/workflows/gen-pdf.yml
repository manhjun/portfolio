name: Generate Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - 'app/pages/resume.vue'
      - 'app/components/resume/**'
      - 'scripts/pdf.js'

jobs:
  gen-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            puppeteer-${{ runner.os }}-

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm dlx puppeteer browsers install chrome

      - name: Build
        run: pnpm run build

      - name: Start server
        run: node .output/server/index.mjs &

      - name: Wait for server
        run: pnpm dlx wait-on http://localhost:3000 --timeout 30000

      - name: Generate Resume PDF
        run: node scripts/pdf.js

      - name: Commit PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: regenerate resume PDF'
          file_pattern: 'public/pdfs/*.pdf'
